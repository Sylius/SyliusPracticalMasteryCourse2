# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    sylius.form.type.customer_group.validation_groups:
        - sylius_custom

services:
    # Default configuration for services in *this* file
    _defaults:
        # Automatically injects dependencies in your services
        autowire: true

        # Automatically registers your services as commands, event subscribers, etc.
        autoconfigure: true

        # Allows optimizing the container by removing unused services; this also means
        # fetching services directly from the container via $container->get() won't work
        public: false

    _instanceof:
        Sylius\Bundle\ResourceBundle\Controller\ResourceController:
            autowire: false
        Sylius\Bundle\ResourceBundle\Form\Type\AbstractResourceType:
            autowire: false

    # Makes classes in src/ available to be used as services;
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Kernel.php'
            - '../src/Factory/'

    # Controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    App\Cli\TestCommand:
        arguments:
            - '@sylius.repository.brand'
            - '@sylius_abstraction.state_machine'
            - '@sylius.manager.brand'

    App\Form\Type\BrandType:
        arguments:
            - '%sylius.model.brand.class%'
            - 
                - 'sylius'

    App\Form\Type\BrandImageType:
        arguments:
            - '%sylius.model.brand_image.class%'
            -
                - 'sylius'

    App\Form\Type\BrandTranslationType:
        arguments:
            - '%sylius.model.brand_translation.class%'

    sylius.custom_factory.brand:
        class: App\Factory\BrandFactory
        decorates: sylius.factory.brand
        arguments:
            - '@sylius.custom_factory.brand.inner'

    App\Grid\Field\AssociatedProductsType:
        tags:
            - { name: sylius.grid_field, type: associated_products }

    App\Grid\Filter\UpdateDelayFilter:
        tags:
            - { name: sylius.grid_filter, type: update_delay, form_type: App\Form\Type\UpdateDelayFilterType }

    sylius_admin.twig.component.brand.form:
#        class: Sylius\Bundle\UiBundle\Twig\Component\ResourceFormComponent
        class: App\Twig\Component\BrandFormComponent
        arguments:
            - '@sylius.repository.brand'
            - '@form.factory'
            - '%sylius.model.brand.class%'
            - 'App\Form\Type\BrandType'
        tags:
            - { name: 'sylius.live_component.admin', key: 'sylius_admin.brand.form' }

    App\Mailer\BrandEmailManager:
        bind:
            $defaultLocaleCode: '%locale%'

    sylius.mailer.order_email_manager:
        class: App\Mailer\OrderEmailManager
        arguments:
            - '@sylius.email_sender'
            - '@sylius.repository.product'

    app.listener.images_upload:
        class: Sylius\Bundle\CoreBundle\EventListener\ImagesUploadListener
        arguments:
            - '@sylius.uploader.image'
        tags:
            - { name: kernel.event_listener, event: 'sylius.brand.pre_create', method: 'uploadImages' }
            - { name: kernel.event_listener, event: 'sylius.brand.pre_update', method: 'uploadImages' }
        
    App\Form\Type\BrandTaxonAutocompleteChoiceType:
        arguments:
            - '@sylius.factory.brand_taxon'
            - '@sylius.repository.brand_taxon'
            -
                - 'sylius'
