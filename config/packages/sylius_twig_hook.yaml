sylius_twig_hooks:
    hooks:
        'sylius_admin.product.create.content.form.side_navigation':
            brand:
                template: 'admin/product/form/side_navigation/brand.html.twig'
        'sylius_admin.product.create.content.form.sections':
            brand:
                template: 'admin/product/form/sections/brand.html.twig'
        'sylius_admin.product.create.content.form.sections.brand':
            brand:
                template: 'admin/product/form/sections/brand/brand.html.twig'
        'sylius_admin.product.update.content.form.side_navigation':
            brand:
                template: 'admin/product/form/side_navigation/brand.html.twig'
        'sylius_admin.product.update.content.form.sections':
            brand:
                template: 'admin/product/form/sections/brand.html.twig'
        'sylius_admin.product.update.content.form.sections.brand':
            brand:
                template: 'admin/product/form/sections/brand/brand.html.twig'

        'sylius_shop.base.header.navbar.menu':
            branded_products:
                template: 'shop/base/header/navbar/menu/branded_products.html.twig'
                priority: 500

        'sylius_admin.brand.create.content.form':
            sections:
                template: 'admin/brand/form.html.twig'
        'sylius_admin.brand.update.content.form':
            sections:
                template: 'admin/brand/form.html.twig'
