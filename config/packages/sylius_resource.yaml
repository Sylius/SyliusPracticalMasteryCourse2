sylius_resource:
    mapping:
        paths:
            - '%kernel.project_dir%/src/Entity'

    resources:
        sylius.brand:
            classes:
                model: App\Entity\Brand\Brand
                repository: App\Repository\BrandRepository
                controller: App\Controller\BrandController
#                form: App\Form\Type\BrandType
            translation:
                classes:
                    model: App\Entity\Brand\BrandTranslation
        sylius.brand_image:
            classes:
                model: App\Entity\Brand\BrandImage
        sylius.brand_taxon:
            classes:
                model: App\Entity\Brand\BrandTaxon
